name: Gerar dados e gráficos

on:
  push:
    branches: [main]
    paths: ["src/**", "sql/**", "requirements.txt", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python src/gerar_dados.py
      - run: python src/analise.py
      - name: Salvar resultados no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data img
          git diff --cached --quiet || git commit -m "Gera dados e gráficos automaticamente"
          git push
